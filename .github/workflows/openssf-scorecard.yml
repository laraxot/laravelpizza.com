# OpenSSF Scorecard — improves public trust signals for OSS eligibility reviews.
# Reader: GitHub Actions. Effect: weekly/push Scorecard SARIF + publish_results.
# Secrets: none in plain text (OIDC id-token only).
# User: "fa tutto quello che serve per far diventare questa repo utile ad avere claude code ultra a gratis"
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "31 7 * * 1"
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@05b567a9194ce3058cc58855502894cdb4839dc9 # v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
