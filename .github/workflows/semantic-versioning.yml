name: Semantic Versioning

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build root artifact
        # L'archivio va fuori dalla cartella archiviata: dentro, tar legge il file mentre lo scrive
        # ("file changed as we read it") e il job fallisce a ogni push.
        run: tar --exclude=.git -czf "$RUNNER_TEMP/project-artifact.tgz" .
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/project-artifact.tgz
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fetch_all_tags: true
          release_branches: main,dev
