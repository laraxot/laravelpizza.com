name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fixcity_test
          POSTGRES_USER: fixcity
          POSTGRES_PASSWORD: secret
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: mbstring, dom, fileinfo, pgsql, redis
        coverage: xdebug

    - name: Copy .env
      run: |
        cd laravel
        cp .env.example .env
        php artisan key:generate

    - name: Install Dependencies
      run: |
        cd laravel
        composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Run Migrations
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: fixcity_test
        DB_USERNAME: fixcity
        DB_PASSWORD: secret
      run: |
        cd laravel
        php artisan migrate --force

    - name: Run PHPStan
      run: |
        cd laravel
        ./vendor/bin/phpstan analyse --level=9 --no-progress

    - name: Run Tests
      env:
        DB_CONNECTION: pgsql
        DB_HOST: localhost
        DB_PORT: 5432
        DB_DATABASE: fixcity_test
        DB_USERNAME: fixcity
        DB_PASSWORD: secret
        REDIS_HOST: localhost
        REDIS_PORT: 6379
      run: |
        cd laravel
        php artisan test --coverage --min=60

    - name: Upload Coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./laravel/coverage.xml
        flags: unittests
        name: codecov-umbrella
