name: 🚀 CI/CD Pipeline - FixCity Platform

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM

env:
  PHP_VERSION: '8.2'
  NODE_VERSION: '18'
  LARAVEL_VERSION: '12.x'
  FILAMENT_VERSION: '4.x'

jobs:
  # 🔍 Code Quality Analysis
  code-quality:
    name: 🔍 Code Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, mysql, zip, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: xdebug
      
      - name: 📦 Install PHP dependencies
        run: |
          cd laravel
          composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: 🔧 Setup environment
        run: |
          cd laravel
          cp .env.example .env
          php artisan key:generate
          php artisan config:cache
      
      - name: 🧪 Run PHPStan (Level 9)
        run: |
          cd laravel
          ./vendor/bin/phpstan analyse Modules --memory-limit=-1 --error-format=json > ../reports/phpstan-report.json || true
        continue-on-error: true
      
      - name: 🔍 Run PHPMD
        run: |
          cd laravel
          ./vendor/bin/phpmd Modules,../Themes xml ../phpmd.xml --report-file=../reports/phpmd-report.xml || true
        continue-on-error: true
      
      - name: 🎨 Run PHP-CS-Fixer (dry-run)
        run: |
          cd laravel
          ./vendor/bin/php-cs-fixer fix --dry-run --diff --config=../.php-cs-fixer.php --format=json > ../reports/php-cs-fixer-report.json || true
        continue-on-error: true
      
      - name: 🎯 Run Laravel Pint (dry-run)
        run: |
          cd laravel
          ./vendor/bin/pint --test --config=../pint.json --format=json > ../reports/laravel-pint-report.json || true
        continue-on-error: true
      
      - name: 📊 Run Psalm
        run: |
          cd laravel
          ./vendor/bin/psalm --config=../psalm.xml --output-format=json > ../reports/psalm-report.json || true
        continue-on-error: true
      
      - name: 📋 Upload code quality reports
        uses: actions/upload-artifact@v3
        with:
          name: code-quality-reports
          path: reports/
          retention-days: 30

  # 🎨 Frontend Quality Analysis
  frontend-quality:
    name: 🎨 Frontend Quality Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install dependencies
        run: |
          cd laravel/Themes/Sixteen
          npm ci
      
      - name: 🔍 Run ESLint
        run: |
          cd laravel/Themes/Sixteen
          npx eslint "resources/**/*.{js,ts,jsx,tsx}" --format=json > ../../../reports/eslint-report.json || true
        continue-on-error: true
      
      - name: 💅 Run Prettier (check)
        run: |
          cd laravel/Themes/Sixteen
          npx prettier --check "resources/**/*.{js,ts,jsx,tsx,css,scss,html,md}" --list-different > ../../../reports/prettier-report.txt || true
        continue-on-error: true
      
      - name: 🎨 Run Stylelint
        run: |
          cd laravel/Themes/Sixteen
          npx stylelint "resources/**/*.{css,scss}" --formatter=json > ../../../reports/stylelint-report.json || true
        continue-on-error: true
      
      - name: 📝 Run Markdownlint
        run: |
          npx markdownlint "**/*.md" --config=.markdownlint.json --format=json > reports/markdownlint-report.json || true
        continue-on-error: true
      
      - name: 📄 Run HTMLHint
        run: |
          npx htmlhint "laravel/Themes/Sixteen/resources/views/**/*.blade.php" --config=.htmlhintrc --format=json > reports/htmlhint-report.json || true
        continue-on-error: true
      
      - name: 📋 Upload frontend quality reports
        uses: actions/upload-artifact@v3
        with:
          name: frontend-quality-reports
          path: reports/
          retention-days: 30

  # 🧪 Testing
  testing:
    name: 🧪 Testing Suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: fixcity_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, mysql, zip, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: xdebug
      
      - name: 📦 Install PHP dependencies
        run: |
          cd laravel
          composer install --no-interaction --prefer-dist --optimize-autoloader
      
      - name: 🔧 Setup test environment
        run: |
          cd laravel
          cp .env.testing .env
          php artisan key:generate
          php artisan config:cache
          php artisan migrate --force
          php artisan db:seed --class=TestSeeder
      
      - name: 🧪 Run Unit Tests
        run: |
          cd laravel
          ./vendor/bin/pest --coverage --coverage-html=../reports/coverage
        continue-on-error: true
      
      - name: 🧪 Run Feature Tests
        run: |
          cd laravel
          ./vendor/bin/pest --testsuite=Feature --coverage
        continue-on-error: true
      
      - name: 🧪 Run Integration Tests
        run: |
          cd laravel
          ./vendor/bin/pest --testsuite=Integration --coverage
        continue-on-error: true
      
      - name: 📊 Upload test reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  # 🏗️ Build
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [code-quality, frontend-quality, testing]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, dom, fileinfo, mysql, zip, bcmath, soap, intl, gd, exif, iconv, imagick
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: 📦 Install PHP dependencies
        run: |
          cd laravel
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev
      
      - name: 📦 Install Node dependencies
        run: |
          cd laravel/Themes/Sixteen
          npm ci
      
      - name: 🎨 Build frontend assets
        run: |
          cd laravel/Themes/Sixteen
          npm run build
      
      - name: 🔧 Optimize Laravel
        run: |
          cd laravel
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
      
      - name: 📦 Create deployment package
        run: |
          tar -czf fixcity-deployment-$(date +%Y%m%d-%H%M%S).tar.gz \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='tests' \
            --exclude='.github' \
            --exclude='reports' \
            --exclude='*.log' \
            laravel/
      
      - name: 📋 Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: fixcity-deployment-*.tar.gz
          retention-days: 7

  # 🚀 Deploy to Staging
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
      
      - name: 🚀 Deploy to staging server
        run: |
          echo "Deploying to staging server..."
          # Add your staging deployment commands here
          # Example: rsync, scp, docker, etc.
      
      - name: 🔔 Notify deployment
        run: |
          echo "Staging deployment completed successfully!"

  # 🚀 Deploy to Production
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts
      
      - name: 🚀 Deploy to production server
        run: |
          echo "Deploying to production server..."
          # Add your production deployment commands here
          # Example: rsync, scp, docker, etc.
      
      - name: 🔔 Notify deployment
        run: |
          echo "Production deployment completed successfully!"

  # 📊 Performance Testing
  performance-testing:
    name: 📊 Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: 📦 Install Lighthouse CI
        run: npm install -g @lhci/cli@0.12.x
      
      - name: 🔍 Run Lighthouse CI
        run: |
          lhci autorun --upload.target=temporary-public-storage
        continue-on-error: true
      
      - name: 📊 Upload performance reports
        uses: actions/upload-artifact@v3
        with:
          name: performance-reports
          path: .lighthouseci/
          retention-days: 30

  # 🔒 Security Scanning
  security-scanning:
    name: 🔒 Security Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🔍 Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: 🔍 Run CodeQL Analysis
        uses: github/codeql-action/init@v2
        with:
          languages: php, javascript
        continue-on-error: true
      
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
        continue-on-error: true
      
      - name: 📊 Upload security reports
        uses: actions/upload-artifact@v3
        with:
          name: security-reports
          path: ./
          retention-days: 30

  # 📈 Generate Reports
  generate-reports:
    name: 📈 Generate Reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [code-quality, frontend-quality, testing, performance-testing, security-scanning]
    if: always()
    
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: all-reports/
      
      - name: 📊 Generate comprehensive report
        run: |
          echo "# 🚀 FixCity Platform - CI/CD Report" > comprehensive-report.md
          echo "**Generated:** $(date)" >> comprehensive-report.md
          echo "**Commit:** ${{ github.sha }}" >> comprehensive-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> comprehensive-report.md
          echo "" >> comprehensive-report.md
          
          echo "## 📊 Summary" >> comprehensive-report.md
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> comprehensive-report.md
          echo "- Frontend Quality: ${{ needs.frontend-quality.result }}" >> comprehensive-report.md
          echo "- Testing: ${{ needs.testing.result }}" >> comprehensive-report.md
          echo "- Performance: ${{ needs.performance-testing.result }}" >> comprehensive-report.md
          echo "- Security: ${{ needs.security-scanning.result }}" >> comprehensive-report.md
          echo "" >> comprehensive-report.md
          
          echo "## 📋 Detailed Reports" >> comprehensive-report.md
          echo "All detailed reports are available in the artifacts section." >> comprehensive-report.md
      
      - name: 📋 Upload comprehensive report
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-report
          path: comprehensive-report.md
          retention-days: 90










