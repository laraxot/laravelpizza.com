name: Code Improvement with Optimized Code Model

on:
  workflow_dispatch:

jobs:
  improve-code:
    name: Improve Code with Optimized Code Model
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Prepare advisory report
        run: |
          cat <<'EOF' > code-improvement-report.md
          # Code Improvement Workflow

          This workflow is intentionally manual-only.

          Reason:
          - the repository root Composer manifest is not the Laravel app manifest
          - Ollama execution on shared GitHub runners is not stable enough for push-triggered automation
          - automatic commits from speculative AI edits are not acceptable on every push

          Use this workflow only as an operator-invoked placeholder until a dedicated remote AI improvement pipeline is defined.
          EOF

      - name: Upload advisory report
        uses: actions/upload-artifact@v4
        with:
          name: code-improvement-report
          path: code-improvement-report.md
