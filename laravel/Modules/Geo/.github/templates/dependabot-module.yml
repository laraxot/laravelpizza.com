# Template: copiare in laravel/Modules/<Modulo>/.github/dependabot.yml
# (repo modulo = root del subtree; directory "/" = root modulo)
version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
