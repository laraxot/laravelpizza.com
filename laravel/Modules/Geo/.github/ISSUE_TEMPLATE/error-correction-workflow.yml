## 🚨 Error Correction Workflow

**Error Type**: {Bug | Performance | Security | Other}  
**Severity**: {Critical | High | Medium | Low}  
**AI Agent**: {Agent Name}  
**Date**: {YYYY-MM-DD}

---

### ✅ 12-Step Checklist

**PRIMA DI CORREGGERE:**

- [ ] 1. **STUDIATO** documentazione esistente
  - [ ] docs/
  - [ ] Modules/*/docs/
  - [ ] Themes/*/docs/
  - [ ] Nessun documento doppio creato

- [ ] 2. **AGGIORNATO DOCS** (prima di codificare)
  - [ ] File esistenti aggiornati
  - [ ] Naming kebab-case
  - [ ] Nessun timestamp nel filename

- [ ] 3. **STUDIATO GIT HISTORY** (forward-only)
  - [ ] `git log --oneline --all -- <file>`
  - [ ] `git show <commit>`
  - [ ] MAI reset/revert effettuati

- [ ] 4. **CAPITO LO SCOPO**
  - [ ] Business value chiaro
  - [ ] Users identificati
  - [ ] Contesto compreso

- [ ] 5. **RAGIONATO**
  - [ ] Analisi completata
  - [ ] Alternative considerate
  - [ ] Decisione documentata

**DURANTE CORREZIONE:**

- [ ] 6. **AGGIORNATO REGOLE**
  - [ ] QWEN.md (se necessario)
  - [ ] docs/rules/
  - [ ] AGENTS.md (se regola generale)

- [ ] 7. **AGGIORNATO MEMORIES**
  - [ ] ~/.qwen/QWEN.md (globale)
  - [ ] _bmad/_memory/ (BMAD)

- [ ] 8. **AGGIORNATO/CREATO SKILLS**
  - [ ] _bmad/core/skills/
  - [ ] Pattern documentati

- [ ] 9. **AGGIORNATO GUIDELINES**
  - [ ] docs/ai-guidelines.md
  - [ ] docs/best-practices/

**DOPO CORREZIONE:**

- [ ] 10. **GITHUB ISSUE**
  - [ ] Issue creata/aggiornata
  - [ ] Label assegnate
  - [ ] Assignee settato

- [ ] 11. **GITHUB ACTIONS** (se necessario)
  - [ ] Workflow creato per prevenzione
  - [ ] CI/CD aggiornato

- [ ] 12. **QUALITY GATES**
  - [ ] PHPStan Level 10: `php -d memory_limit=2G ./vendor/bin/phpstan analyse`
  - [ ] PHPMD: `./vendor/bin/phpmd <path> text codesize,unusedformalparameters`
  - [ ] PHPInsights: `./vendor/bin/phpinsights analyse`
  - [ ] Pest: `./vendor/bin/pest`

---

### 🚫 Regole Critiche

**DATABASE SACRO:**
- [ ] MAI usato `migrate:refresh`, `migrate:fresh`, `db:wipe`
- [ ] MAI usato `RefreshDatabase` trait
- [ ] MAI usato `migrate --force` manualmente

**GIT FORWARD-ONLY:**
- [ ] MAI fatto `git reset --hard HEAD~N`
- [ ] MAI fatto `git checkout <old_commit>`
- [ ] MAI fatto `git revert` (se non forward fix)

**DOCUMENTAZIONE:**
- [ ] MAI creati documenti doppi (usati indici)
- [ ] MAI usati timestamp nei filename
- [ ] MAI numerati file (doc-1.md)

**MULTI-AI COORDINATION:**
- [ ] Letto docs/ai-agent-coordination.md
- [ ] Controllate GitHub Issues aperte
- [ ] Commit piccoli e frequenti
- [ ] Push eseguito (ogni 5-10 minuti)

**GIT REMOTE:**
- [ ] Verificato remote con `git remote -v`
- [ ] Pushato su repo corretta

