name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
tag-prefix: v

categories:
  - title: "Features"
    labels:
      - feature
      - feat
  - title: "Bug Fixes"
    labels:
      - bug
      - fix
      - bugfix
  - title: "Documentation"
    labels:
      - docs
  - title: "Maintenance"
    labels:
      - chore
      - refactor
      - perf
      - test
      - build
      - ci

exclude-contributors:
  - dependabot
  - dependabot[bot]
  - github-actions
  - github-actions[bot]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
template: |
  ## Changes

  $CHANGES
