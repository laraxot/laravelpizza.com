name: Context-mode indexer
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * *' # daily at 03:00 UTC

jobs:
  index-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Run token guard
        run: |
          python3 scripts/ai_token_guard.py
      - name: Run context indexer
        run: |
          chmod +x scripts/context_index.sh
          ./scripts/context_index.sh
