# Sincronizza CHANGELOG dopo Release (analytics in changelog-advanced.yml)
name: Update Changelog

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Pull latest tags
        run: git fetch --tags --force

      - name: Ensure CHANGELOG exists
        run: test -f CHANGELOG.md || echo "# Changelog" > CHANGELOG.md

      - name: Commit if semantic-release left local changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: sync changelog after release [skip ci]"
          git push || true
