# Changelog alternativo via git-cliff (TOML, gruppi conventional) — dispatch o post-release
name: Changelog git-cliff

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versione in output (es. Unreleased)"
        required: false
        type: string
        default: Unreleased
  workflow_run:
    workflows:
      - Release
    types:
      - completed
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  cliff:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --strip header
        env:
          OUTPUT: docs/chat/changelog-git-cliff.md

      - name: Commit cliff changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/chat/changelog-git-cliff.md 2>/dev/null || true
          git diff --staged --quiet || git commit -m "docs(changelog): git-cliff output [skip ci]"
          git push || true
