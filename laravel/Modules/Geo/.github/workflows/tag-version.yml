# Dispatch manuale release semantic-release (API / altri workflow)
name: Tag Version (dispatch release)

on:
  repository_dispatch:
    types:
      - tag-version
      - semantic-release
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-release:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}"
