# PTVX local vhost — SSOT nel repo
# Deploy: sudo cp laravel/config/vhost/ptvx.local.conf /etc/apache2/sites-available/ptvx.local.conf
#         sudo systemctl reload apache2
#
# Nota: con mod_php8.4 globale, spesso basta public_html/.htaccess (SetHandler application/x-httpd-php).
# Se si usa solo FPM, abilitare php8.4-fpm e decommentare il blocco FilesMatch sotto.

<VirtualHost *:80>
    ServerName ptvx.local

    DocumentRoot /var/www/_bases/base_ptvx_fila5/public_html

    <Directory /var/www/_bases/base_ptvx_fila5/public_html>
        Options -Indexes +FollowSymLinks +MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Opzionale — solo se php8.4-fpm è installato e mod_php non usato:
    # <FilesMatch ".+\.ph(?:ar|p|tml)$">
    #     SetHandler "proxy:unix:/run/php/php8.4-fpm.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/ptvx.local-error.log
    CustomLog ${APACHE_LOG_DIR}/ptvx.local-access.log combined
</VirtualHost>
