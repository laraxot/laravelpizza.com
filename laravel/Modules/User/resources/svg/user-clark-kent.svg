<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class="w-7 h-7">
  <defs>
    <filter id="clark-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#clark-glow)" class="animate-float">
    <!-- Occhiali / riposo -->
    <circle cx="18" cy="24" r="5" stroke-width="1"/>
    <circle cx="30" cy="24" r="5" stroke-width="1"/>
    <line x1="23" y1="24" x2="25" y2="24" stroke-width="1"/>
    <!-- Sorriso elegante -->
    <path d="M20 30 Q24 35 28 30" stroke-width="1.2"/>
    <!-- Capelli / fronte -->
    <path d="M14 18 Q24 6 34 18" stroke-width="1.5"/>
    <path d="M16 16 Q24 10 32 16" stroke-width="1"/>
    <!-- Colletto camicia -->
    <path d="M18 38 L24 34 L30 38 L30 42 L18 42 Z" stroke-width="1"/>
  </g>
  <style>
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
    .animate-float { animation: float 3s ease-in-out infinite; }
  </style>
</svg>
