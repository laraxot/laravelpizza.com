<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" role="img">
  <!--
    Foglio di calcolo esportato in coda (ExportXlsxAction: export nativo Filament,
    il file arriva con una notifica). Leggibile a 16-24 px senza testo.
    Sia xls sia xlsx producono un .xlsx: per l'utente la differenza non e' il formato
    ma "adesso" (xls.svg) contro "in coda" (questo, con l'orologio). Le due azioni stanno
    affiancate nella stessa toolbar ed entrambe sono verdi, quindi l'icona deve distinguerle.
    Stile Heroicons outline (story Xot 8.5).
    Disegno precedente: pagina custom con piega a spigolo, barra header piena (fill) come
    segno di "foglio di calcolo moderno (xlsx)", griglia 2x3 e freccia export. Sostituito
    perche' il fill rompeva l'outline e a 16 px l'insieme diventava una macchia piena.
  -->
  <!--
    Pagina: stessa geometria del path Heroicons o-document, ma bordo destro e bordo
    in basso si interrompono attorno all'orologio, come fanno file-clock di Lucide e
    simili: niente tratti che si toccano.
  -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 12v-.375a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M13.125 21.75h-7.5c-.621 0-1.125-.504-1.125-1.125V3.375c0-.621.504-1.125 1.125-1.125H10.5a9 9 0 0 1 9 9v.75"/>
  <!--
    Tabella ridotta in alto a sinistra: stessa idea della griglia di xls.svg,
    con 2 righe (riga di intestazione + corpo) al posto della vecchia barra piena.
    Ridotta per lasciare spazio libero attorno all'orologio.
  -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M9 11.25h3a.75.75 0 0 1 .75.75v3.75a.75.75 0 0 1-.75.75H9a.75.75 0 0 1-.75-.75V12a.75.75 0 0 1 .75-.75ZM8.25 13.875h4.5"/>
  <!-- Orologio in basso a destra: export in coda, il file arriva dopo -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M18 16.5V18h1.125M21 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
  <!-- Foglio con angolo piegato: leggibile a 16-24px senza testo -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75h6.75L18 7.5v11.25a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5V5.25a1.5 1.5 0 0 1 1.5-1.5Z"/>
  <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 3.75V7.5H18"/>
  <!-- Intestazione tabella piena = foglio di calcolo moderno (xlsx) -->
  <path stroke-linecap="round" stroke-linejoin="round" fill="currentColor" d="M8.25 10.5h7.5v1.75H8.25z"/>
  <!-- Corpo: griglia 2x3 a sinistra -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 12.25H12v5.25H8.25z"/>
  <path stroke-linecap="round" d="M8.25 14H12M8.25 15.75H12M10.1 12.25v5.25"/>
  <!-- Freccia export a destra: il dato esce dal file -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M14.1 12.6v4m0 0-1.35-1.35m1.35 1.35 1.35-1.35"/>
</svg>
