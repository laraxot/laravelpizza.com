<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true" role="img">
  <!--
    Foglio PDF in stile Heroicons outline (story Xot 8.5): solo path, niente <text>.
    La pagina e' il path `document` di Heroicons, identico, cosi' l'icona sta accanto
    a quelle vere senza sembrare di un'altra famiglia.
    Disegno precedente: pagina custom stretta (x 6-18) con piega a spigolo, "P" piccola
    piu' una freccia export. Sostituito perche' a 16-20 px la freccia (punte da 1.35)
    spariva e la "P" restava a meta' dimensione.
  -->
  <!-- Pagina: piega arrotondata in alto a destra + contorno (path Heroicons o-document) -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/>
  <!--
    Glifo "P" grande e centrato (x 9.75-14.25, y 11.25-18): l'unica lettera che regge
    a toolbar size e distingue il PDF da un documento generico.
    Prima era "a sinistra" per fare posto alla freccia; la freccia e' stata tolta perche'
    tutte le icone xot-files sono export, quindi non distingueva nulla.
  -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 18v-6.75h2.25a2.25 2.25 0 0 1 0 4.5H9.75"/>
  <!-- Foglio PDF: piega + badge tipografico semplificato (solo path, niente <text>) -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 3.75h6.75L18 7.5v11.25a1.5 1.5 0 0 1-1.5 1.5h-9a1.5 1.5 0 0 1-1.5-1.5V5.25a1.5 1.5 0 0 1 1.5-1.5Z"/>
  <path stroke-linecap="round" stroke-linejoin="round" d="M14.25 3.75V7.5H18"/>
  <!-- Glifo "P" stilizzato a sinistra: riconoscibile a toolbar size -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M9 11.25v6M9 11.25h2.4a1.8 1.8 0 0 1 0 3.6H9"/>
  <!-- Freccia export a destra: il dato esce dal file -->
  <path stroke-linecap="round" stroke-linejoin="round" d="M14.4 11.5v5m0 0-1.35-1.35m1.35 1.35 1.35-1.35"/>
</svg>
